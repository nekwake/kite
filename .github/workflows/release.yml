# Publishes a release when a version tag (v1.2.3) is pushed: a universal macOS
# .dmg for downloads, plus the signed update bundle and latest.json that running
# copies of Kite check. The source repo can stay private: releases go to the
# public nekwake/kite-releases repo.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Fine-grained token with "Contents: read and write" on nekwake/kite-releases
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the update bundle; generated with `npx tauri signer generate`
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: nekwake
          repo: kite-releases
          tagName: ${{ github.ref_name }}
          releaseName: Kite ${{ github.ref_name }}
          releaseBody: "Aşağıdaki .dmg dosyasını indir (Apple Silicon ve Intel). Kurulu Kite bu sürümü kendisi önerir."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
